spring.application.name=hwc-backend


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


server.port=8080


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-terra}
openai.responses-url=${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}

coach.marketing.rag.enabled=${COACH_MARKETING_RAG_ENABLED:true}
coach.marketing.rag.embedding-model=${COACH_MARKETING_EMBEDDING_MODEL:text-embedding-3-small}
coach.marketing.rag.max-results=${COACH_MARKETING_RAG_MAX_RESULTS:5}
coach.marketing.rag.min-score=${COACH_MARKETING_RAG_MIN_SCORE:0.65}

chat.memory.max-messages=${CHAT_MEMORY_MAX_MESSAGES:12}
chat.retention-days=${CHAT_RETENTION_DAYS:30}
chat.cleanup-cron=${CHAT_CLEANUP_CRON:0 30 3 * * *}

coach.objectives-cron=${COACH_OBJECTIVES_CRON:0 0 8 * * MON}
coach.summary-cron=${COACH_SUMMARY_CRON:0 0 17 * * FRI}
coach.time-zone=${COACH_TIME_ZONE:Africa/Casablanca}
coach.email.enabled=${COACH_EMAIL_ENABLED:false}
coach.email.from=${COACH_EMAIL_FROM:coach@hwc.com}
coach.frontend-url=${COACH_FRONTEND_URL:http://localhost:5173}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
